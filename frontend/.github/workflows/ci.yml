name: Ouvidoria 360 - CI (Integração Contínua)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificacao-de-codigo:
    # Cria uma máquina virtual limpa com a última versão do Ubuntu
    runs-on: ubuntu-latest

    # Passo a passo que a máquina vai executar
    steps:
      - name: 📥 Clonar o código do repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Salva as bibliotecas em cache para rodar muito mais rápido na próxima vez!

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔍 Rodar o Linter (Busca erros de sintaxe e más práticas)
        run: npm run lint

      - name: 🧪 Rodar os Testes (Garantir que tudo funciona como esperado)
        run: npm test -- --watchAll=false

      - name: 🏗️ Testar o Build (Garantir que a aplicação compila para produção)
        run: npm run build